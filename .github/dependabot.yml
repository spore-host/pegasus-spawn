# Dependabot configuration for pegasus-spawn.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Why this file exists: the action in .github/workflows is pinned to a commit SHA
# (#1), which closes the mutable-tag hole but opens a staleness one — a SHA never
# moves, including past a security fix, and unlike `@v4` nothing updates it.
# Pinning is only safe when something bumps the pins. That something is this file.
#
# Lowest-risk repo in the suite: no release workflow, no publish authority, and the
# composition test uses a stubbed `spawn task run` with no AWS credentials and no
# real instances. The pins are here so this repo doesn't quietly diverge from the
# suite baseline, not because it holds anything worth stealing.
#
# No `pip` entry: this repo has no pyproject.toml. Add one alongside it if that
# changes — a Python dependency with nothing watching it is the same gap as an
# unbumped action pin.

version: 2
updates:
  # GitHub Actions. Dependabot understands SHA pins: it rewrites both the SHA and
  # the trailing `# vX.Y.Z` comment, so the pins stay readable and reviewable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    # Don't propose a release the day it ships; let it sit a week first. A fresh
    # action tag is exactly when a compromised or broken one is still unnoticed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    # No `reviewers:` key on purpose — it's deprecated and inert. Every one of the
    # umbrella repo's Dependabot PRs asks for a reviewer and none has ever had a
    # review request. Use CODEOWNERS if you want one.
    groups:
      # One PR for all of them. The pattern is "*", not "actions/*": the only
      # action here is under actions/ today, but the first one that isn't would
      # silently fall outside the group and stop being bumped.
      github-actions:
        patterns:
          - "*"
