name: DAGMan composition test

# Proves the one thing that needs a real Pegasus/HTCondor: that DAGMan runs the
# pegasus-spawn-run wrapper as a workflow node, in dependency order, and tracks
# node success/failure by the wrapper's exit code (with RETRY). A stub `spawn`
# stands in for `spawn task run`, so NO AWS credentials and NO real instances are
# involved — the test is free and hermetic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Reads two files; deliberately its OWN job rather than a step in `composition`,
  # so a broken pin is reported in seconds instead of waiting on a Pegasus image
  # build and a privileged HTCondor container.
  ci-hygiene:
    name: CI hygiene (action pins + Dependabot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert actions are pinned and Dependabot bumps them
        run: bash tests/ci-hygiene.sh

  composition:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not `@v4`: a tag is mutable, and
      # actions/checkout@v6 really did move (df4cb1c → d23441a) with no signal to
      # consumers. Dependabot bumps this pin (.github/dependabot.yml) so it stays
      # current without being mutable; tests/ci-hygiene.sh keeps both true. (#1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Pegasus + minicondor test image
        run: docker build -t pegasus-spawn-test -f tests/Dockerfile .

      - name: Run DAGMan composition test (stubbed spawn, no AWS)
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/work:ro" \
            pegasus-spawn-test \
            bash -lc '
              set -e
              # HTCondor is brought up by root, but it will NOT let root own jobs —
              # so plan/submit must run as the non-root scitech user (created in the
              # Dockerfile). Copy the read-only mount to a scitech-owned workspace.
              sudo condor_master || condor_master
              cp -r /work /home/scitech/pegasus-spawn
              sudo chown -R scitech:scitech /home/scitech/pegasus-spawn 2>/dev/null || chown -R scitech /home/scitech/pegasus-spawn
              pip3 install --quiet pegasus-wms.api 2>/dev/null || sudo pip3 install --quiet pegasus-wms.api || true
              sudo -u scitech env REPO=/home/scitech/pegasus-spawn HOME=/home/scitech \
                bash /home/scitech/pegasus-spawn/tests/composition-test.sh
            '
